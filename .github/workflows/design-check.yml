name: Daily Design Check (visual + structural regression)

# Design-oriented guard for alexpavsky.com, separate from the main Playwright CI.
# It runs the tests/design-regression.spec.ts suite — structural invariants
# (footer compact, no overflow, Digest modal, nav present, console clean) plus
# pixel snapshots of the stable design surfaces (footer, nav, Digest modal).
#
# It runs INSIDE the same Playwright image the baselines were generated in, so
# the pixel snapshots are deterministic (no cross-runner font-AA flake). When a
# design change or break is detected, bug_report_slack.py posts the diff
# screenshots to the #bug-reports Slack channel.
#
# Every run publishes its Playwright HTML report (per-test steps, errors and,
# on a break, the visual diff viewer) to GitHub Pages under
# design-check/runs/<run number>/, and the Slack summary links to it, so the
# daily message opens the full report instead of only the Actions log.

on:
  workflow_dispatch:
  schedule:
    # 3:10 AM America/New_York. The gate selects the correct DST slot.
    - cron: '10 7 * * *'
    - cron: '10 8 * * *'

permissions:
  contents: write

concurrency:
  group: design-check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "10 7 * * *|EDT"|"10 8 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  design-check:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Same image the baselines were generated in → pixel-stable snapshots.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The image ships browsers, but the installed Playwright build expects the
      # split chrome-headless-shell binary which isn't always present after a
      # clean npm ci — install it explicitly (fast no-op if already there).
      - name: Ensure Chromium is installed
        run: npx playwright install chromium

      - name: Run design regression (structural + visual)
        env:
          CI: true
        run: npx playwright test design-regression --project=chromium

      - name: Upload report + visual diffs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: design-check-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish full report to GitHub Pages
        id: publish
        if: always() && hashFiles('playwright-report/index.html') != ''
        # Reporting, not verification: a gh-pages push race with another
        # publisher must not turn a green design check red. Slack then falls
        # back to the GitHub run link only.
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./playwright-report
          destination_dir: design-check/runs/${{ github.run_number }}
          keep_files: true
          enable_jekyll: false
          commit_message: "design check report: run #${{ github.run_number }}"

      - name: Notify Slack summary (UI / design)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPORT_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          report_url=""
          if [ "$REPORT_PUBLISHED" = "true" ]; then
            owner_lc="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
            report_url="https://${owner_lc}.github.io/${GITHUB_REPOSITORY#*/}/design-check/runs/${RUN_NUMBER}/"
            # Pages deploys shortly after the push; wait so the Slack button
            # works on the first click. Not fatal if it is still deploying.
            python3 - "$report_url" <<'PY'
          import sys, time, urllib.request
          url = sys.argv[1]
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      if resp.status == 200:
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(5)
          print(f"{url} is still deploying; the Slack link will work shortly.")
          PY
          fi
          # Daily heartbeat to the dedicated UI / design channel, pass or break.
          python3 .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_UI_CODEX_CHANNEL_ID }}" \
            --pipeline "Daily Design Check" \
            --results-dir test-results \
            --scope "Layout guard for alexpavsky.com: footer, navigation, Digest modal, overflow, console errors and pixel snapshots. Functional, API and AI checks report separately." \
            --dashboard-url "$report_url" \
            --dashboard-label "Open full report" \
            --run-label "GitHub run"

      - name: Post design break to Slack #bug-reports
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 .github/scripts/bug_report_slack.py \
            --channel "${{ secrets.BUG_REPORTS_CHANNEL_ID }}" \
            --pipeline "Daily Design Check" \
            --results-dir test-results
