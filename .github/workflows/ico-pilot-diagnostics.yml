name: I-Copilot Diagnostics

# The full workflow diagnostic (server, MacBook audio, iPad mirror, iPhone
# camera, voice ping with headphone/speaker audio) runs on the i-Copilot
# server every day at 1:00 PM America/New_York (systemd timer), while the
# MacBook and mobile devices may be online,
# and publishes latest.json. This workflow posts that result to #ico-pilot.

on:
  workflow_dispatch:
  schedule:
    # Post the daytime hardware report at 1:20 PM America/New_York.
    - cron: "20 17 * * *"
    - cron: "20 18 * * *"

concurrency:
  group: ico-pilot-diagnostics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "20 17 * * *|EDT"|"20 18 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  post:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Post diagnostic to #ico-pilot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ICO_PILOT_REPORT_BASE_URL: ${{ vars.ICO_PILOT_REPORT_BASE_URL }}
        run: |
          : "${ICO_PILOT_REPORT_BASE_URL:?ICO_PILOT_REPORT_BASE_URL repository variable is required}"
          python3 .github/scripts/notify_icopilot_diagnostic_slack.py \
            --base-url "${ICO_PILOT_REPORT_BASE_URL%/}/diagnostics" \
            --channel "${{ vars.SLACK_ICO_PILOT_CHANNEL_ID || 'C0C1FRGJB1Q' }}"
