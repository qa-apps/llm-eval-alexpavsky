name: promptfoo Daily Eval

# Runs the permanent reduced promptfoo suite defined in promptfooconfig.yaml
# instead of the old 49-probe battery. Separate from the Playwright pipeline
# and the k6 workflow, the same way k6-performance.yml runs on its own.
#
# Results post to a dedicated Slack channel (SLACK_PROMPTFOO_RESULTS_CHANNEL_ID).

on:
  workflow_dispatch:
  schedule:
    # 4:30 AM America/New_York. The gate below selects the correct DST slot.
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"

concurrency:
  group: promptfoo-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "30 8 * * *|EDT"|"30 9 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  promptfoo:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      eval_day: ${{ steps.eval_day.outputs.date }}
      completion_ready: ${{ steps.completion_ready.outputs.ready }}
    env:
      CLOUD_EVAL_API_KEY: cloud-eval
      CLOUD_EVAL_ROUTE_MODE: go-primary
      REQUEST_TIMEOUT_MS: '180000'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 945 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/promptfoo.done
          key: cloud-promptfoo-v1-${{ steps.eval_day.outputs.date }}

      - name: Probe OpenCode Go subscription key
        if: steps.daily_marker.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from eval.cloud_gateway import chat, configured_routes

          routes = [route for route in configured_routes() if route[0] == "opencode-go"]
          if not routes:
              raise SystemExit("OpenCode Go key is not configured")
          result = chat({
              "messages": [{"role": "user", "content": "In Python, what does len([]) return? One word."}],
              "max_tokens": 64,
          }, routes)
          print(f"OpenCode Go live probe: {result['model']}; usage={result.get('usage', {})}")
          PY

      - name: Probe OpenCode Go JSON judge
        if: steps.daily_marker.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENCODE_API_KEY", "")
          if not key:
              raise SystemExit("OpenCode Go key is not configured")
          payload = {
              "model": "deepseek-v4.1-flash",
              "messages": [{"role": "user", "content": 'Return a JSON object with the key "answer" and the value 0.'}],
              "max_tokens": 1024,
              "response_format": {"type": "json_object"},
              "thinking": {"type": "disabled"},
          }
          request = urllib.request.Request(
              "https://opencode.ai/zen/go/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "User-Agent": "PW-cloud-eval/1.0",
                  "x-opencode-session": f"promptfoo-judge-probe-{os.environ['GITHUB_RUN_ID']}",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              body = json.loads(error.read())
              message = str(body.get("error", {}).get("message", "unknown"))
              raise SystemExit(f"Go judge probe HTTP {error.code}: {message.replace(key, '[redacted]')[:250]}") from None
          content = result.get("choices", [{}])[0].get("message", {}).get("content", "")
          print(f"Go JSON judge live probe: {json.loads(content)}; usage={result.get('usage', {})}")
          PY

      - name: Start cloud evaluation gateway and verify a real completion
        id: cloud_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -u eval/cloud_gateway.py > cloud-gateway.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 120 http://127.0.0.1:18765/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"cloud-eval","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":64}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["choices"][0]["message"]["content"]'
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Report gateway failure
        if: failure() && steps.cloud_llm.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_eval_status_slack.py \
            --channel "${{ secrets.SLACK_PROMPTFOO_RESULTS_CHANNEL_ID }}" \
            --suite "Promptfoo Daily" --detail "Cloud model gateway failed its live completion check; no test result was fabricated."

      - name: Checkout existing gh-pages site (if any)
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Set up Node.js
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.cloud_llm.outputs.run == 'true'
        run: npm ci

      - name: Set up Python
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run promptfoo eval
        if: steps.cloud_llm.outputs.run == 'true'
        id: eval
        continue-on-error: true
        # Step-level cap so a hung eval can't eat the whole job — the
        # always() Notify Slack step below still runs after a step timeout.
        timeout-minutes: 420
        env:
          # Non-interactive: promptfoo hangs with zero output in a non-TTY
          # runner if it tries telemetry / update-check / a progress TUI.
          # These + stdin from /dev/null keep it fully headless.
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
          PROMPTFOO_DISABLE_SHARE: "1"
          # Assertion failures are evaluated by the dedicated quality step below.
          # Promptfoo still exits 1 for operational errors.
          PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"
          CI: "true"
        run: |
          CONFIG=promptfooconfig.yaml
          expected_count=$(node -e 'const fs=require("fs"); const YAML=require("yaml"); const c=YAML.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(c.tests.length * c.prompts.length * c.providers.length)' "$CONFIG")
          echo "Running promptfoo with $CONFIG"
          deadline=$((SECONDS + 180))
          mkdir -p .promptfoo-quarantine
          if [ -d .promptfoo-attempts ]; then
            mv .promptfoo-attempts ".promptfoo-quarantine/attempts-$GITHUB_RUN_ID"
          fi
          mkdir -p .promptfoo-attempts
          if [ -e promptfoo-results.json ]; then
            mv promptfoo-results.json ".promptfoo-quarantine/preexisting-results-$GITHUB_RUN_ID.json"
          fi
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            attempt_results=".promptfoo-attempts/results-$attempt.json"
            attempt_log=".promptfoo-attempts/run-$attempt.log"
            set +e
            npx promptfoo eval -c "$CONFIG" \
              --max-concurrency 1 \
              --no-cache \
              --no-progress-bar \
              -o "$attempt_results" </dev/null 2>&1 | tee "$attempt_log"
            status=${PIPESTATUS[0]}
            set -e

            # The Ollama provider currently collapses gateway 423 responses
            # into near-instant empty "No output" responses. Retry only when
            # more than half the suite has that exact infrastructure signature,
            # so a genuine slow blank response cannot become retry-until-green.
            # Keep a hard attempt cap as a second guard.
            infra_no_output=false
            if [ ! -s "$attempt_results" ]; then
              if grep -Eqi '(^|[^0-9])(HTTP (423|503)|status( code)?[:= ]+(423|503)|service unavailable|ECONNRESET|socket hang up|connection refused)([^0-9]|$)' "$attempt_log"; then
                infra_no_output=true
              fi
            elif ! python3 -m json.tool "$attempt_results" >/dev/null 2>&1; then
              if grep -Eqi '(^|[^0-9])(HTTP (423|503)|status( code)?[:= ]+(423|503)|service unavailable|ECONNRESET|socket hang up|connection refused)([^0-9]|$)' "$attempt_log"; then
                infra_no_output=true
              fi
            elif python3 -c 'import json,re,sys; results=json.load(open(sys.argv[1], encoding="utf-8")).get("results", {}).get("results", []); transient=re.compile(r"(?:\bHTTP\s*(?:423|503)\b|\bstatus(?: code)?\s*[:=]?\s*(?:423|503)\b|\bservice unavailable\b|\bECONNRESET\b|\bsocket hang up\b|\bconnection refused\b)", re.I); transport=sum(1 for result in results if transient.search(str(result.get("error", "")))); fast_blank=sum(1 for result in results if result.get("error") == "No output" and not str((result.get("response") or {}).get("output", "")).strip() and isinstance(result.get("latencyMs"), (int, float)) and result["latencyMs"] < 1000); raise SystemExit(0 if transport > 0 or (results and fast_blank > len(results) / 2) else 1)' "$attempt_results"
            then
              infra_no_output=true
            elif [ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8")).get("results", {}).get("results", [])))' "$attempt_results")" -lt "$expected_count" ]; then
              if grep -Eqi '(^|[^0-9])(HTTP (423|503)|status( code)?[:= ]+(423|503)|service unavailable|ECONNRESET|socket hang up|connection refused)([^0-9]|$)' "$attempt_log"; then
                infra_no_output=true
              fi
            fi

            if [ "$status" -eq 0 ] && [ "$infra_no_output" = false ]; then
              cp "$attempt_results" promptfoo-results.json
              break
            fi

            if [ "$infra_no_output" = true ] && [ "$attempt" -lt 5 ] && [ "$SECONDS" -lt "$deadline" ]; then
              echo "Local-model attempt was incomplete or transiently unavailable; retrying in 10s (attempt $attempt/5)."
              sleep 10
              continue
            fi
            if [ -s "$attempt_results" ]; then
              cp "$attempt_results" promptfoo-results.json
            fi
            if [ "$status" -eq 0 ]; then
              status=1
            fi
            exit "$status"
          done

      - name: Validate promptfoo results
        id: validate_results
        if: always() && steps.cloud_llm.outputs.run == 'true'
        continue-on-error: true
        run: |
          node -e 'const fs=require("fs"); const YAML=require("yaml"); const config=YAML.parse(fs.readFileSync(process.argv[1], "utf8")); const results=JSON.parse(fs.readFileSync(process.argv[2], "utf8")).results?.results ?? []; const providerIds=config.providers.map(provider => typeof provider === "string" ? provider : provider.id); const expected=[]; for (let testIdx=0; testIdx<config.tests.length; testIdx++) for (let promptIdx=0; promptIdx<config.prompts.length; promptIdx++) for (const providerId of providerIds) expected.push({testIdx,promptIdx,providerId,description:config.tests[testIdx].description,vars:config.tests[testIdx].vars}); const actual=results.map(result => ({testIdx:result.testIdx,promptIdx:result.promptIdx,providerId:result.provider?.id,description:result.testCase?.description,vars:result.vars})).sort((a,b) => a.testIdx-b.testIdx || a.promptIdx-b.promptIdx || a.providerId.localeCompare(b.providerId)); expected.sort((a,b) => a.testIdx-b.testIdx || a.promptIdx-b.promptIdx || a.providerId.localeCompare(b.providerId)); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`test identities differ: expected ${JSON.stringify(expected)}, found ${JSON.stringify(actual)}`); const invalid=results.filter(result => result.error || !String(result.response?.output ?? "").trim()); if (invalid.length) throw new Error(`found ${invalid.length} error or empty-output results`);' promptfooconfig.yaml promptfoo-results.json

      - name: Verify all Promptfoo assertions passed
        id: assertions_passed
        if: always() && steps.validate_results.outcome == 'success'
        continue-on-error: true
        run: |
          node -e 'const fs=require("fs"); const results=JSON.parse(fs.readFileSync(process.argv[1], "utf8")).results?.results ?? []; const failed=results.filter(result => result.success !== true); if (failed.length) throw new Error(`${failed.length} Promptfoo assertions failed`);' promptfoo-results.json

      - name: Upload promptfoo results
        id: upload_results
        if: always() && steps.cloud_llm.outputs.run == 'true' && hashFiles('promptfoo-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promptfoo-results
          path: |
            promptfoo-results.json
            cloud-eval-ledger.jsonl
            cloud-gateway.log
          retention-days: 14

      - name: Build Promptfoo Pages UI
        id: build_site
        if: always() && steps.validate_results.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: python scripts/build_promptfoo_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.validate_results.outcome == 'success' && steps.build_site.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: promptfoo-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack
        id: notify_slack
        if: always() && steps.validate_results.outcome == 'success' && steps.upload_results.outcome == 'success' && steps.build_site.outcome == 'success' && steps.upload_pages.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          PROMPTFOO_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/promptfoo/runs/${{ github.run_number }}/"
          python .github/scripts/notify_promptfoo_slack.py \
            --channel "${{ secrets.SLACK_PROMPTFOO_RESULTS_CHANNEL_ID }}" \
            --results promptfoo-results.json \
            --dashboard-url "$PROMPTFOO_DASHBOARD_URL" \
            --local-ui-url "${{ vars.PROMPTFOO_LOCAL_UI_URL || 'http://localhost:15500' }}" \
            --require-delivery

      - name: Report incomplete Promptfoo evaluation
        if: always() && steps.cloud_llm.outputs.run == 'true' && (steps.validate_results.outcome != 'success' || steps.upload_results.outcome != 'success' || steps.build_site.outcome != 'success' || steps.upload_pages.outcome != 'success' || steps.notify_slack.outcome != 'success')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_eval_status_slack.py \
            --channel "${{ secrets.SLACK_PROMPTFOO_RESULTS_CHANNEL_ID }}" \
            --suite "Promptfoo Daily" --detail "Evaluation or reporting was incomplete; inspect the workflow logs."

      - name: Mark reporting complete
        id: completion_ready
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.eval.outcome == 'success' && steps.validate_results.outcome == 'success' && (steps.assertions_passed.outcome == 'success' || steps.assertions_passed.outcome == 'failure') && steps.upload_results.outcome == 'success' && steps.build_site.outcome == 'success' && steps.upload_pages.outcome == 'success' && steps.notify_slack.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # Keep report publishing and Slack notification above this gate, then
      # make the workflow conclusion reflect the real Promptfoo result.
      - name: Enforce Promptfoo result
        if: always() && steps.cloud_llm.outputs.run == 'true' && (steps.completion_ready.outputs.ready != 'true' || steps.assertions_passed.outcome != 'success')
        run: |
          echo "::error::Promptfoo assertions failed or the evaluation report was incomplete."
          exit 1


  publish-promptfoo-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always() && needs.promptfoo.result != 'skipped'
    needs: promptfoo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        if: needs.promptfoo.outputs.completion_ready == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: promptfoo-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        id: publish_pages
        if: needs.promptfoo.outputs.completion_ready == 'true' && steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "promptfoo site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Pages publication
        if: always() && needs.promptfoo.outputs.completion_ready == 'true' && (steps.download_pages.outcome != 'success' || steps.publish_pages.outcome != 'success')
        run: |
          echo "::error::Promptfoo Pages publication failed."
          exit 1

  complete-daily-run:
    name: Save completed daily report marker
    if: always() && github.event_name == 'schedule' && needs.promptfoo.outputs.completion_ready == 'true' && needs['publish-promptfoo-pages'].result == 'success'
    needs: [promptfoo, publish-promptfoo-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Create completion marker
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/promptfoo.done

      - name: Cache daily completion marker
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/promptfoo.done
          key: cloud-promptfoo-v1-${{ needs.promptfoo.outputs.eval_day }}
