name: Weekly QA Report

on:
  schedule:
    # Sunday 06:50 America/New_York, after the daily RAG evaluation.
    - cron: '50 10 * * 0'
    - cron: '50 11 * * 0'
  workflow_dispatch:        # Run manually from GitHub Actions UI

concurrency:
  group: weekly-qa-report
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "50 10 * * 0|EDT"|"50 11 * * 0|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  generate-report:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUD_EVAL_ROUTE_MODE: go-primary
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Download latest Playwright artifact that actually exists. The workflow
      # has schedule-gate-only success runs with no artifacts, so picking the
      # newest successful run blindly creates a green "0 tests" report.
      - name: Download latest Playwright test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results
          found=0

          for run_id in $(gh run list \
            --workflow playwright-ci.yml \
            --branch master \
            --status success \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId'); do
            echo "Checking Playwright run ${run_id} for test-results artifact"
            if gh run download "$run_id" -n test-results -D "test-results/$run_id" 2>/dev/null; then
              if find "test-results/$run_id" -name 'results-pure.json' -print -quit | grep -q .; then
                echo "Downloaded test-results from Playwright run ${run_id}"
                found=1
                break
              fi
            fi
          done

          if [[ "$found" != "1" ]]; then
            echo "::error::No Playwright test-results artifact with results-pure.json found"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx python-dateutil

      - name: Start cloud report judge and verify a real completion
        run: |
          set -euo pipefail
          nohup python3 -u eval/cloud_gateway.py > cloud-gateway.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 120 http://127.0.0.1:18765/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"cloud-eval","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":64}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["choices"][0]["message"]["content"]'

      - name: Generate weekly report and send to Slack + site
        env:
          LOCAL_LLM_BASE_URL:  http://127.0.0.1:18765/v1
          LOCAL_LLM_API_KEY:   cloud-eval
          LOCAL_LLM_MODEL:     cloud-eval
          LOCAL_LLM_JOB_ID:    ${{ github.run_id }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_REPORTS_URL:    https://alexpavsky.com/api/agent-reports
          MAINTENANCE_KEY:     ${{ secrets.MAINTENANCE_KEY }}
          GITHUB_RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/weekly_report.py

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: weekly-report-${{ github.run_id }}
          path: judge-verdicts/weekly-report-*.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_WEEKLY_REPORT_CHANNEL_ID }}" \
            --pipeline "Weekly QA Report" \
            --results-dir test-results \
            --results-pattern "**/results-pure.json"
