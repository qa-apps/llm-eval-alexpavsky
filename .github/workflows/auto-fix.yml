name: Auto-fix Agent

on:
  workflow_run:
    workflows:
      - "Playwright CI (deterministic tests)"
      - "LLM Quality (LLM Judge tests)"
      - "LLM Eval Nightly (Ragas + Giskard)"
      - "I-Copilot Multimodal Report"
    types: [completed]

jobs:
  # Gate job runs unconditionally so the workflow conclusion is "success"
  # instead of "skipped" when there's nothing to fix. Without this,
  # every passing upstream run produced a "Run skipped" email.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        run: |
          conclusion="${{ github.event.workflow_run.conclusion }}"
          echo "Upstream workflow conclusion: $conclusion"
          head_branch="${{ github.event.workflow_run.head_branch }}"
          echo "Upstream head branch: $head_branch"
          if [ "$conclusion" = "failure" ] && [ "$head_branch" = "master" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing eligible to fix — only failed master runs enter the autonomous merge workflow."
          fi

  auto-fix:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install needed — auto_fix_agent.py + llm_client.py use
      # only Python stdlib (urllib.request). All rotation logic is local.

      - name: Configure git
        run: |
          git config user.email "qa-apps@users.noreply.github.com"
          git config user.name "qa-apps and claude"

      - name: Download test artifacts from failed run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const fs = require('fs');
            for (const artifact of artifacts.data.artifacts) {
              const names = ['test-results', 'playwright-report', 'eval-results', 'eval-report'];
              if (names.some(n => artifact.name.includes(n))) {
                const zip = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync(`${artifact.name}.zip`, Buffer.from(zip.data));
                console.log(`Downloaded: ${artifact.name}.zip`);
              }
            }

      - name: Extract artifacts
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f" -d "${f%.zip}/" && echo "Extracted $f" || true
          done

      - name: Run auto-fix agent
        # OpenCode is the only paid cloud provider allowed for agent-fix.
        # Evaluation workflows use the free-tier gateway with DeepSeek fallback.
        env:
          OPENCODE_API_KEY:   ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL:     kimi-k2.7-code
          ENABLE_OPENCODE_PROVIDER: "true"
          LLM_PROVIDER_MODE:  opencode-only
          AGENT_FIX_LLM_TIMEOUT_SEC: "480"
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          # Slack ping when a PR is opened — no webhook needed, bot token only.
          # PR-review pings go to the dedicated #ci-pr-review channel; the
          # bug-reports channel stays the fallback if PR_REVIEW_CHANNEL_ID is unset.
          SLACK_BOT_TOKEN:        ${{ secrets.SLACK_BOT_TOKEN }}
          PR_REVIEW_CHANNEL_ID:   ${{ secrets.PR_REVIEW_CHANNEL_ID }}
          BUG_REPORTS_CHANNEL_ID: ${{ secrets.BUG_REPORTS_CHANNEL_ID }}
          # Detailed Investigation / Fix / Resolution reports land here
          # (#qa-agent-reports). Falls back to the PR-review channel if unset.
          AGENT_REPORTS_CHANNEL_ID: ${{ secrets.AGENT_REPORTS_CHANNEL_ID }}
          HUMAN_REVIEW_CHANNEL_ID: ${{ secrets.HUMAN_REVIEW_CHANNEL_ID }}
          FAILED_RUN_ID:      ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL:     ${{ github.event.workflow_run.html_url }}
          PIPELINE:           ${{ github.event.workflow_run.name }}
          REPO:               ${{ github.repository }}
          HEAD_SHA:           ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH:        ${{ github.event.workflow_run.head_branch }}
        run: python .github/scripts/auto_fix_agent.py
