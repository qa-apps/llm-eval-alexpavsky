name: LLM Eval Nightly (Ragas + Giskard)

on:
  # Manual trigger from Actions UI
  workflow_dispatch:
    inputs:
      max_questions:
        description: 'Limit Ragas golden questions (0 = all)'
        required: false
        default: '10'
      rag_api_url:
        description: 'RAG API URL'
        required: false
        default: 'https://alexpavsky.com'
      giskard_num_questions:
        description: 'Giskard RAG questions (auto-generated)'
        required: false
        default: '5'
      run_giskard_scan:
        description: 'Run the full Giskard vulnerability scan'
        required: false
        type: boolean
        default: false

  # 5:30 AM America/New_York. The gate below selects the correct DST slot.
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'

concurrency:
  group: ragas-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "30 9 * * *|EDT"|"30 10 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      eval_date: ${{ steps.eval_day.outputs.date }}
      completion_ready: ${{ steps.completion_gate.outputs.ready }}
    env:
      CLOUD_EVAL_API_KEY: cloud-eval
      CLOUD_EVAL_BASE_URL: http://127.0.0.1:18765/v1
      OLLAMA_BASE_URL: http://127.0.0.1:18765
      LOCAL_LLM_TIMEOUT_SEC: '180'
      LOCAL_LLM_TIMEOUT_MS: '180000'
      LOCAL_LLM_MAX_TOKENS: '2048'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 825 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/ragas-giskard.done
          key: cloud-ragas-giskard-v1-${{ steps.eval_day.outputs.date }}

      - name: Start cloud gateway and verify a real completion
        id: cloud_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -u eval/cloud_gateway.py > cloud-gateway.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 120 http://127.0.0.1:18765/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"cloud-eval","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":64}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["choices"][0]["message"]["content"]'
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Report cloud gateway failure
        if: failure() && steps.cloud_llm.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_eval_status_slack.py \
            --channel "${{ secrets.SLACK_GISKARD_CHANNEL_ID }}" \
            --suite "Ragas + Giskard" --detail "Cloud gateway failed its live completion check; tests did not run."

      - name: Checkout existing gh-pages site (if any)
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Set up Python 3.11
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'eval/requirements.txt'

      - name: Install Ragas + LangChain
        if: steps.cloud_llm.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r eval/requirements.txt

      - name: Record Ragas and Giskard run start
        if: steps.cloud_llm.outputs.run == 'true'
        run: python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"]).joinpath("ragas-giskard-start-ns").write_text(str(time.time_ns()))'

      - name: Run Ragas evaluation
        id: ragas_eval
        if: steps.cloud_llm.outputs.run == 'true'
        env:
          # RAG API endpoint (production)
          RAG_API_URL: ${{ inputs.rag_api_url || 'https://alexpavsky.com' }}
          # Quality gates
          MAX_QUESTIONS: ${{ inputs.max_questions || '10' }}
          MIN_FAITHFULNESS: '0.50'
          MIN_RELEVANCY: '0.35'
          ALLOWED_FAILURES: '3'
          REQUEST_DELAY_SEC: '2.0'
          RAGAS_METRIC_RETRIES: '2'
        run: |
          python eval/ragas_eval.py

      - name: Run Giskard RAG eval (auto-generated questions)
        id: giskard_eval
        if: always() && steps.cloud_llm.outputs.run == 'true'
        working-directory: eval
        env:
          RAG_API_URL: ${{ inputs.rag_api_url || 'https://alexpavsky.com' }}
          GISKARD_NUM_QUESTIONS: ${{ inputs.giskard_num_questions || '5' }}
          MIN_GISKARD_CORRECTNESS: '0.50'
        run: |
          python giskard_rag.py

      - name: Run Giskard vulnerability scan (5 categories)
        id: giskard_scan
        if: ${{ always() && steps.cloud_llm.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.run_giskard_scan == true || inputs.run_giskard_scan == 'true') }}
        working-directory: eval
        env:
          RAG_API_URL: ${{ inputs.rag_api_url || 'https://alexpavsky.com' }}
          GISKARD_MAX_ISSUES_PER_DETECTOR: '3'
          GISKARD_MAX_ALLOWED_ISSUES: '0'
        run: |
          python giskard_scan.py

      - name: Validate complete eval reports
        id: report_contract
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          EXPECTED_RAGAS_CASES: ${{ inputs.max_questions || '10' }}
          EXPECTED_GISKARD_CASES: ${{ inputs.giskard_num_questions || '5' }}
          REQUIRE_SCAN: ${{ github.event_name == 'schedule' || inputs.run_giskard_scan == true || inputs.run_giskard_scan == 'true' }}
          RAGAS_OUTCOME: ${{ steps.ragas_eval.outcome }}
          GISKARD_OUTCOME: ${{ steps.giskard_eval.outcome }}
          SCAN_OUTCOME: ${{ steps.giskard_scan.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          started = int(Path(os.environ["RUNNER_TEMP"]).joinpath("ragas-giskard-start-ns").read_text())

          def load(name):
              path = Path("eval/results") / name
              if not path.is_file():
                  raise SystemExit(f"Missing report: {path}")
              if path.stat().st_mtime_ns < started:
                  raise SystemExit(f"Stale report from an earlier run: {path}")
              return json.loads(path.read_text(encoding="utf-8"))

          def require_fresh(name):
              path = Path("eval/results") / name
              if not path.is_file():
                  raise SystemExit(f"Missing report: {path}")
              if path.stat().st_mtime_ns < started:
                  raise SystemExit(f"Stale report from an earlier run: {path}")

          for required in ("report.md", "summary.json", "ragas_cases.json",
                           "giskard_rag.html", "giskard_rag.json",
                           "giskard_rag_cases.json"):
              require_fresh(required)

          ragas_data = load("ragas_cases.json")
          ragas_summary = load("summary.json")
          giskard_data = load("giskard_rag_cases.json")
          ragas = ragas_data.get("cases", [])
          giskard = giskard_data.get("cases", [])
          expected_ragas = int(os.environ["EXPECTED_RAGAS_CASES"])
          expected_giskard = int(os.environ["EXPECTED_GISKARD_CASES"])

          if expected_ragas and len(ragas) != expected_ragas:
              raise SystemExit(f"Ragas report has {len(ragas)}/{expected_ragas} cases")
          if len(giskard) != expected_giskard:
              raise SystemExit(f"Giskard report has {len(giskard)}/{expected_giskard} cases")
          if not ragas or not all(c.get("prompt") and c.get("answer") and isinstance(c.get("passed"), bool) for c in ragas):
              raise SystemExit("Ragas report is missing prompt, answer, or verdict fields")
          if any(not isinstance(c.get("faithfulness"), (int, float)) or not isinstance(c.get("relevancy"), (int, float)) for c in ragas):
              raise SystemExit("Ragas report contains missing judge metrics")
          if not giskard or not all(c.get("prompt") and c.get("answer") and c.get("status") in {"PASS", "FAIL"} for c in giskard):
              raise SystemExit("Giskard report is missing prompt, answer, or verdict fields")

          def validate_outcome(label, data, outcome):
              if data.get("evaluation_completed") is not True or not isinstance(data.get("quality_passed"), bool):
                  raise SystemExit(f"{label} did not record a completed evaluation")
              expected = "success" if data["quality_passed"] else "failure"
              if outcome != expected:
                  raise SystemExit(f"{label} outcome {outcome!r} does not match quality verdict {expected!r}")

          validate_outcome("Ragas", ragas_summary, os.environ["RAGAS_OUTCOME"])
          validate_outcome("Giskard RAG", giskard_data, os.environ["GISKARD_OUTCOME"])
          if os.environ["REQUIRE_SCAN"].lower() == "true":
              require_fresh("giskard_scan.html")
              scan = load("giskard_scan.json")
              if not isinstance(scan.get("total_issues"), int):
                  raise SystemExit("Giskard vulnerability report is incomplete")
              validate_outcome("Giskard scan", scan, os.environ["SCAN_OUTCOME"])
          elif os.environ["SCAN_OUTCOME"] != "skipped":
              raise SystemExit(f"Optional Giskard scan should be skipped, got {os.environ['SCAN_OUTCOME']!r}")
          print(f"Validated {len(ragas)} Ragas and {len(giskard)} Giskard cases")
          PY

      - name: Upload eval reports
        id: upload_reports
        if: always() && steps.cloud_llm.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: eval-reports-${{ github.run_number }}
          path: |
            eval/results/report.md
            eval/results/summary.json
            eval/results/ragas_cases.json
            eval/results/giskard_rag.html
            eval/results/giskard_rag.json
            eval/results/giskard_rag_cases.json
            eval/results/giskard_scan.html
            eval/results/giskard_scan.json
            cloud-eval-ledger.jsonl
            cloud-gateway.log
          retention-days: 30
          if-no-files-found: warn

      - name: Build GitHub Pages site
        id: build_pages
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          python scripts/build_eval_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success' && steps.build_pages.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: eval-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Post summary to job
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          PAGES_URL="https://${OWNER_LC}.github.io/${REPO_NAME}"
          echo "## 📊 Live dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "- All runs: ${PAGES_URL}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- This run (Ragas): ${PAGES_URL}/runs/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- This run (Giskard): ${PAGES_URL}/runs/${{ github.run_number }}/giskard.html" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f eval/results/report.md ]; then
            echo "## Ragas Evaluation Summary" >> "$GITHUB_STEP_SUMMARY"
            head -30 eval/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f eval/results/giskard_rag.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Giskard RAG Eval" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat eval/results/giskard_rag.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f eval/results/giskard_scan.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Giskard Vulnerability Scan" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat eval/results/giskard_scan.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Slack
        id: notify_ragas
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          # Read pass/fail counts written by eval/ragas_eval.py (summary.json).
          # The old grep-the-markdown approach never matched anything because
          # report.md has no "passed: N" / "failed: N" lines — that's why
          # #qa-rag-eval used to always show 0/0.
          PASSED=0; FAILED=0
          if [ -f eval/results/summary.json ]; then
            PASSED=$(python3 -c "import json; print(json.load(open('eval/results/summary.json'))['passed'])")
            FAILED=$(python3 -c "import json; print(json.load(open('eval/results/summary.json'))['failed'])")
          fi
          python .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_RAGAS_CHANNEL_ID || 'ragas' }}" \
            --pipeline "RAG Eval Nightly" \
            --passed "${PASSED:-0}" \
            --failed "${FAILED:-0}" \
            --flaky 0 \
            --skipped 0 \
            --dashboard-url "https://${OWNER_LC}.github.io/${REPO_NAME}/runs/${{ github.run_number }}/#ragas" \
            --dashboard-label "Open Ragas report" \
            --require-delivery

      - name: Notify Giskard Slack
        id: notify_giskard
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          # Giskard RAG correctness + 7-category vuln scan -> its own channel,
          # separate from the Ragas faithfulness/relevancy summary above.
          python .github/scripts/notify_giskard_slack.py \
            --channel "${{ secrets.SLACK_GISKARD_CHANNEL_ID }}" \
            --results-dir eval/results \
            --run-url "$GITHUB_RUN_URL" \
            --dashboard-url "https://${OWNER_LC}.github.io/${REPO_NAME}/runs/${{ github.run_number }}/giskard.html" \
            --require-delivery

      - name: Send failure email (severity-tagged)
        if: failure() && steps.cloud_llm.outputs.run == 'true'
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/scripts/notify_email.py \
            --severity major \
            --pipeline "LLM Eval Nightly (Ragas + Giskard)" \
            --status failure \
            --run-url "$RUN_URL"

      - name: Post bug report to Slack
        if: failure() && steps.cloud_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_REF:         ${{ github.ref }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
          # Root-cause repair is handled separately by the OpenCode-only
          # Auto-fix Agent; this report step is deterministic and local-only.
        run: |
          python .github/scripts/bug_report_slack.py \
            --channel "${{ secrets.BUG_REPORTS_CHANNEL_ID }}" \
            --pipeline "RAG Eval Nightly" \
            --results-dir eval/results

      - name: Evaluate daily completion gate
        id: completion_gate
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          REPORT_CONTRACT: ${{ steps.report_contract.outcome }}
          REPORT_UPLOAD: ${{ steps.upload_reports.outcome }}
          PAGES_BUILD: ${{ steps.build_pages.outcome }}
          PAGES_UPLOAD: ${{ steps.upload_pages.outcome }}
          RAGAS_SLACK: ${{ steps.notify_ragas.outcome }}
          GISKARD_SLACK: ${{ steps.notify_giskard.outcome }}
          RAGAS_EVAL: ${{ steps.ragas_eval.outcome }}
          GISKARD_EVAL: ${{ steps.giskard_eval.outcome }}
          GISKARD_SCAN: ${{ steps.giskard_scan.outcome }}
          REQUIRE_SCAN: ${{ github.event_name == 'schedule' || inputs.run_giskard_scan == true || inputs.run_giskard_scan == 'true' }}
        run: |
          ready=true
          for outcome in "$REPORT_CONTRACT" "$REPORT_UPLOAD" "$PAGES_BUILD" "$PAGES_UPLOAD" "$RAGAS_SLACK" "$GISKARD_SLACK"; do
            [ "$outcome" = "success" ] || ready=false
          done
          for outcome in "$RAGAS_EVAL" "$GISKARD_EVAL"; do
            [ "$outcome" = "success" ] || [ "$outcome" = "failure" ] || ready=false
          done
          if [ "$REQUIRE_SCAN" = "true" ]; then
            [ "$GISKARD_SCAN" = "success" ] || [ "$GISKARD_SCAN" = "failure" ] || ready=false
          else
            [ "$GISKARD_SCAN" = "skipped" ] || ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = "true" ] || echo "::warning::Daily marker withheld because an eval did not run or reports, Pages input, or Slack delivery was incomplete."


  publish-eval-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always() && needs.evaluate.result != 'skipped'
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        if: needs.evaluate.outputs.completion_ready == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: eval-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        id: publish_pages
        if: needs.evaluate.outputs.completion_ready == 'true' && steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "eval site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Pages publication
        if: always() && needs.evaluate.outputs.completion_ready == 'true' && (steps.download_pages.outcome != 'success' || steps.publish_pages.outcome != 'success')
        run: |
          echo "::error::Ragas/Giskard Pages publication failed."
          exit 1

      - name: Save daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs.evaluate.outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/ragas-giskard.done

      - name: Cache daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs.evaluate.outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/ragas-giskard.done
          key: cloud-ragas-giskard-v1-${{ needs.evaluate.outputs.eval_date }}
