name: Python Eval CI

on:
  push:
    branches: [master]
    paths:
      - "eval/**"
      - "tests/unit/**"
      - ".github/workflows/python-eval-ci.yml"
  pull_request:
    paths:
      - "eval/**"
      - "tests/unit/**"
      - ".github/workflows/python-eval-ci.yml"

permissions:
  contents: read

jobs:
  validate-eval-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install evaluation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r eval/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify evaluation imports
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from ragas import EvaluationDataset, SingleTurnSample, evaluate
          from ragas.embeddings import LangchainEmbeddingsWrapper
          from ragas.llms import LangchainLLMWrapper
          from ragas.metrics import Faithfulness, ResponseRelevancy
          from eval.rotating_llm import RotatingJudgeLLM, build_provider_list
          import giskard

          assert build_provider_list()[0]["name"] == "cloud-eval"
          print("Evaluation runtime imports successfully")
          PY
      - name: Run Python unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/unit -q
