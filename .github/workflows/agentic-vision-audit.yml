name: AlexPavsky Daily Audit

on:
  workflow_dispatch:
  schedule:
    # 05:45 America/New_York, after the overnight text evaluation queue.
    - cron: '45 9 * * *'
    - cron: '45 10 * * *'

concurrency:
  group: agentic-vision-audit-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "45 9 * * *|EDT"|"45 10 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  vision-audit:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      REPO_DIR: ${{ github.workspace }}
      PAGES_DIR: ${{ github.workspace }}/daily-audit-pages
      SITE_DIR: ${{ github.workspace }}/daily-audit-site
      AUDIT_OUTPUT_DIR: ${{ github.workspace }}/daily-audit-runs/${{ github.run_id }}/vision-audit
      CLOUD_EVAL_BASE_URL: http://127.0.0.1:18765/v1
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        id: bootstrap
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Start cloud Vision judge
        id: vision_gateway
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -u eval/cloud_gateway.py > cloud-gateway.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18765/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ready"]'

      - name: Run required UI, AI Chat, Voice, Challenge, and Vision journeys
        id: audit
        if: steps.vision_gateway.outcome == 'success'
        continue-on-error: true
        env:
          BASE_URL: https://www.alexpavsky.com
          PLAYWRIGHT_PACKAGE_PATH: ${{ github.workspace }}/node_modules/@playwright/test
          VISION_AUDIT_OUTPUT_DIR: ${{ env.AUDIT_OUTPUT_DIR }}
        shell: bash
        run: |
          mkdir -p "$AUDIT_OUTPUT_DIR"
          python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"]).joinpath("vision-audit-start-ns").write_text(str(time.time_ns()))'
          cd "$REPO_DIR"
          node .github/scripts/vision_audit_agent.mjs

      - name: Validate complete Daily Audit evidence
        id: report_contract
        if: always() && steps.bootstrap.outcome == 'success'
        env:
          REPORT_PATH: ${{ env.AUDIT_OUTPUT_DIR }}/vision-audit-report.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          if not report_path.is_file():
              raise SystemExit("Daily Audit report is missing")
          started = int(Path(os.environ["RUNNER_TEMP"]).joinpath("vision-audit-start-ns").read_text())
          if report_path.stat().st_mtime_ns < started:
              raise SystemExit("Daily Audit report is stale")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = {
              *(f"LINK-{index:03d}" for index in range(1, 11)),
              "CHAT-001", "CHAT-002", "VOICE-001", "VOICE-002", "CHALLENGE-001",
          }
          steps = report.get("steps") or []
          actual = {str(step.get("test_case_id")) for step in steps}
          if len(steps) != len(expected) or actual != expected:
              raise SystemExit(
                  f"Daily Audit has {len(steps)}/{len(expected)} cases; "
                  f"missing={sorted(expected - actual)} unexpected={sorted(actual - expected)}"
              )
          if report.get("status") not in {"passed", "failed"} or report.get("operational_error"):
              raise SystemExit("Daily Audit did not finish cleanly")
          provenance = report.get("model_provenance") or {}
          if provenance.get("execution") != "cloud-routed" or provenance.get("local_llm_calls") != 0:
              raise SystemExit("Daily Audit evaluator provenance is not cloud-routed")
          usage = report.get("model_usage") or {}
          if usage.get("calls") != len(expected) or provenance.get("cloud_llm_calls") != len(expected):
              raise SystemExit("Daily Audit is missing cloud Vision decisions")
          required = (
              "test_case_name", "objective", "expected_result", "actual_result",
              "summary", "verdict", "browser_evidence",
          )
          for step in steps:
              missing = [field for field in required if not step.get(field)]
              if missing:
                  raise SystemExit(f"{step.get('test_case_id')} is missing {missing}")
              screenshot = Path(str(step.get("screenshot") or ""))
              if not screenshot.is_file():
                  raise SystemExit(f"{step.get('test_case_id')} screenshot is missing: {screenshot}")
              if step.get("llm_execution") != "cloud-routed" or step.get("llm_provider") not in {"nvidia-vision", "deepseek"}:
                  raise SystemExit(f"{step.get('test_case_id')} has invalid model provenance")
          video = Path(str(report.get("video") or ""))
          if not video.is_file():
              raise SystemExit(f"Daily Audit video is missing: {video}")
          print(f"Validated {len(steps)} Daily Audit cases, screenshots, cloud decisions, and video")
          PY

      - name: Build and publish detailed Daily Audit UI
        id: publish
        if: always() && steps.bootstrap.outcome == 'success' && steps.report_contract.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
          VISION_AUDIT_SOURCE: ${{ env.AUDIT_OUTPUT_DIR }}
          VISION_AUDIT_EXISTING: ${{ github.workspace }}/daily-audit-pages
          VISION_AUDIT_SITE: ${{ github.workspace }}/daily-audit-site
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$AUDIT_OUTPUT_DIR/vision-audit-report.json"
          [[ -f "$REPORT" ]] || { echo "No Vision report to publish."; exit 1; }
          AUTH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ -d "$PAGES_DIR/.git" ]]; then
            git -C "$PAGES_DIR" remote set-url origin "$AUTH_URL"
            git -C "$PAGES_DIR" pull --ff-only origin gh-pages
          else
            git clone --branch gh-pages --single-branch "$AUTH_URL" "$PAGES_DIR"
          fi
          cd "$REPO_DIR"
          python3 scripts/build_vision_audit_site.py
          cp -a "$SITE_DIR"/. "$PAGES_DIR"/
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add .nojekyll vision-audit
          if ! git -C "$PAGES_DIR" diff --cached --quiet; then
            git -C "$PAGES_DIR" commit -m "vision audit site: run #${RUN_NUMBER}"
            git -C "$PAGES_DIR" push origin gh-pages
          fi

      - name: Post summary and every test case to Slack
        id: notify
        if: always() && steps.bootstrap.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          export VISION_AUDIT_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/vision-audit/runs/${{ github.run_number }}/"
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            "$VISION_AUDIT_DASHBOARD_URL" >/dev/null || \
            echo "Daily Audit UI is still deploying; Slack links will become available shortly."
          cd "$REPO_DIR"
          python3 .github/scripts/notify_vision_slack.py \
            --report "$AUDIT_OUTPUT_DIR/vision-audit-report.json" \
            --channel "${{ secrets.SLACK_UI_CODEX_CHANNEL_ID }}" \
            --require-delivery

      - name: Finalize Daily Audit status
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in \
            "${{ steps.vision_gateway.outcome }}" \
            "${{ steps.audit.outcome }}" \
            "${{ steps.report_contract.outcome }}" \
            "${{ steps.publish.outcome }}" \
            "${{ steps.notify.outcome }}"; do
            [[ "$outcome" == "success" ]] || failed=1
          done
          exit "$failed"
