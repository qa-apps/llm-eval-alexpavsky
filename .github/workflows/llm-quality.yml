name: LLM Quality (LLM Judge tests)

# Companion to playwright-ci.yml. The "LLM Judge" suite lives here because
# every test exercises production /api/chat and grades only essential behavior
# with a cloud-routed judge. Style and tone are not quality gates.
#
# This workflow runs the same tests as main in isolation. The test step is
# temporarily non-blocking so reports and Slack notifications are always
# produced; a final step restores the correct failed job status.

on:
  workflow_dispatch:
  schedule:
    # 3:45 AM America/New_York. The gate below selects the correct DST slot;
    - cron: '45 7 * * *'
    - cron: '45 8 * * *'

concurrency:
  group: llm-quality-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "45 7 * * *|EDT"|"45 8 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  llm-quality:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      eval_date: ${{ steps.eval_day.outputs.date }}
      completion_ready: ${{ steps.completion_gate.outputs.ready }}
    env:
      LOCAL_LLM_BASE_URL: http://127.0.0.1:18765/v1
      CLOUD_EVAL_ROUTE_MODE: go-primary
      LOCAL_LLM_MODEL: cloud-eval
      LOCAL_LLM_API_KEY: cloud-eval
      LOCAL_LLM_TIMEOUT_MS: '180000'
      LOCAL_LLM_MAX_TOKENS: '1024'
      LLM_TEST_TIMEOUT_MS: '300000'
      LLM_JUDGE_PASSING_SCORE: '3'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 870 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/llm-quality.done
          key: cloud-llm-quality-v1-${{ steps.eval_day.outputs.date }}

      - name: Start cloud judge and verify a real completion
        id: cloud_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -u eval/cloud_gateway.py > cloud-gateway.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 120 http://127.0.0.1:18765/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"cloud-eval","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":64}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["choices"][0]["message"]["content"]'
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Report cloud judge failure
        if: failure() && steps.cloud_llm.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_eval_status_slack.py \
            --channel "${{ secrets.SLACK_LLM_QUALITY_CHANNEL_ID }}" \
            --suite "LLM Quality" --detail "Cloud judge failed its live completion check; tests did not run."

      - name: Checkout existing gh-pages site (if any)
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Set up Node.js
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.cloud_llm.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright browsers
        id: install_browser
        if: steps.cloud_llm.outputs.run == 'true'
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            npx playwright install ffmpeg
            echo "Using system Google Chrome on the GitHub runner."
          else
            npx playwright install chromium
            echo "Using the Playwright-managed Chromium binary."
          fi

      - name: Record LLM Judge run start
        if: steps.cloud_llm.outputs.run == 'true'
        run: python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"]).joinpath("llm-quality-start-ns").write_text(str(time.time_ns()))'

      - name: Run LLM Judge tests
        if: steps.cloud_llm.outputs.run == 'true'
        # Keep later report, artifact, and Slack steps running on failures.
        continue-on-error: true
        id: run_tests
        # "LLM Judge" = the dedicated judge suite; "Content quality" = the
        # @upstream article-quality-judge specs, migrated here so their judge
        # uses the shared Go-primary cloud judge.
        run: npx playwright test --grep "LLM Judge|Content quality" --workers=1 --reporter=list,json,html
        env:
          CI: true
          QA_BYPASS_TOKEN: ${{ secrets.QA_BYPASS_TOKEN }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
          PROBES_PER_FEED: '4'

      - name: Validate complete LLM Judge report
        id: report_contract
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          TEST_RUN_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("test-results/results.json")
          if not report_path.is_file():
              raise SystemExit("Missing Playwright JSON report")
          started = int(Path(os.environ["RUNNER_TEMP"]).joinpath("llm-quality-start-ns").read_text())
          if report_path.stat().st_mtime_ns < started:
              raise SystemExit("Playwright JSON report is stale")
          report = json.loads(report_path.read_text(encoding="utf-8"))

          tests = []
          final_retries = {}
          def walk(suite, parents=()):
              title = str(suite.get("title") or "")
              file = str(suite.get("file") or "")
              path = parents + ((title,) if title and title != file else ())
              for spec in suite.get("specs", []) or []:
                  for test in spec.get("tests", []) or []:
                      tests.append(test)
                      key = path + (str(spec.get("title") or "test"),)
                      final_retries[key] = max(0, len(test.get("results", []) or []) - 1)
              for child in suite.get("suites", []) or []:
                  walk(child, path)
          for suite in report.get("suites", []) or []:
              walk(suite)

          if len(tests) != 20:
              raise SystemExit(f"LLM Judge report has {len(tests)}/20 tests")
          statuses = {"expected", "unexpected", "flaky"}
          if any(test.get("status") not in statuses for test in tests):
              raise SystemExit("LLM Judge report contains a skipped or incomplete test status")
          quality_passed = all(test["status"] != "unexpected" for test in tests)
          expected_outcome = "success" if quality_passed else "failure"
          if os.environ["TEST_RUN_OUTCOME"] != expected_outcome:
              raise SystemExit(
                  f"LLM Judge step outcome {os.environ['TEST_RUN_OUTCOME']!r} does not match "
                  f"the complete report quality verdict {expected_outcome!r}"
              )

          verdict_files = list(Path("test-results").rglob("verdicts.jsonl"))
          verdict_files += list(Path("judge-verdicts").rglob("verdicts.jsonl"))
          verdict_files = [path for path in verdict_files if path.stat().st_mtime_ns >= started]
          if not verdict_files:
              raise SystemExit("No current-run judge verdict files were created")
          all_verdicts = []
          for path in verdict_files:
              for line in path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  if line.strip():
                      all_verdicts.append(json.loads(line))

          # Playwright records verdicts for every retry. A complete report is
          # defined by the final attempt for each test, not by every attempt
          # appended to the JSONL file.
          verdicts = [
              verdict for verdict in all_verdicts
              if tuple(str(part) for part in verdict.get("titlePath") or []) in final_retries
              and int(verdict.get("retry") or 0) == final_retries[
                  tuple(str(part) for part in verdict.get("titlePath") or [])
              ]
          ]
          if len(verdicts) != 24:
              raise SystemExit(
                  f"LLM Judge final attempts have {len(verdicts)}/24 structured judge verdicts "
                  f"({len(all_verdicts)} including retries)"
              )
          if any(not v.get("prompt") or not v.get("response") or not v.get("reasoning") for v in verdicts):
              raise SystemExit("A judge verdict is missing prompt, response, or reasoning")
          print(f"Validated {len(tests)} tests and {len(verdicts)} judge verdicts")
          PY

      - name: Upload Playwright report
        id: upload_playwright
        if: always() && steps.cloud_llm.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: llm-quality-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload judge verdicts
        id: upload_verdicts
        if: always() && steps.cloud_llm.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: judge-verdicts-${{ github.run_number }}
          path: |
            test-results/
            judge-verdicts/
            cloud-eval-ledger.jsonl
            cloud-gateway.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Post summary to job
        if: always() && steps.cloud_llm.outputs.run == 'true'
        run: |
          echo "## LLM Quality Run #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests in this workflow probe the production AI chatbot via" >> "$GITHUB_STEP_SUMMARY"
          echo "the production chatbot and grade essential behavior with cloud-routed model \`$LOCAL_LLM_MODEL\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Style and tone are intentionally outside this smoke gate." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Step status:** ${{ steps.run_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`llm-quality-report-${{ github.run_number }}\` — full Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`judge-verdicts-${{ github.run_number }}\` — per-prompt judge scores + reasoning" >> "$GITHUB_STEP_SUMMARY"

      - name: Build LLM Judge Pages UI
        id: build_pages
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: python3 scripts/build_llm_judge_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success' && steps.build_pages.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: llm-quality-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack
        id: notify_slack
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          LLM_JUDGE_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/llm-judge/runs/${{ github.run_number }}/"
          python3 .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_LLM_QUALITY_CHANNEL_ID }}" \
            --pipeline "LLM Quality" \
            --results-dir test-results \
            --dashboard-url "$LLM_JUDGE_DASHBOARD_URL" \
            --dashboard-label "Open LLM Judge UI" \
            --require-delivery


      - name: Post bug report to Slack
        if: steps.cloud_llm.outputs.run == 'true' && steps.run_tests.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_REF:         ${{ github.ref }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
        run: |
          python3 .github/scripts/bug_report_slack.py \
            --channel "${{ secrets.BUG_REPORTS_CHANNEL_ID }}" \
            --pipeline "LLM Quality" \
            --results-dir test-results

      - name: Evaluate daily completion gate
        id: completion_gate
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          BROWSER_INSTALL: ${{ steps.install_browser.outcome }}
          REPORT_CONTRACT: ${{ steps.report_contract.outcome }}
          PLAYWRIGHT_UPLOAD: ${{ steps.upload_playwright.outcome }}
          VERDICT_UPLOAD: ${{ steps.upload_verdicts.outcome }}
          PAGES_BUILD: ${{ steps.build_pages.outcome }}
          PAGES_UPLOAD: ${{ steps.upload_pages.outcome }}
          JUDGE_SLACK: ${{ steps.notify_slack.outcome }}
          TEST_RUN: ${{ steps.run_tests.outcome }}
        run: |
          ready=true
          for outcome in "$BROWSER_INSTALL" "$REPORT_CONTRACT" "$PLAYWRIGHT_UPLOAD" "$VERDICT_UPLOAD" "$PAGES_BUILD" "$PAGES_UPLOAD" "$JUDGE_SLACK"; do
            [ "$outcome" = "success" ] || ready=false
          done
          [ "$TEST_RUN" = "success" ] || [ "$TEST_RUN" = "failure" ] || ready=false
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = "true" ] || echo "::warning::Daily marker withheld because report, artifact, Pages input, or Slack delivery was incomplete."

      - name: Fail if LLM quality tests failed
        if: steps.cloud_llm.outputs.run == 'true' && steps.run_tests.outcome == 'failure'
        run: exit 1


  publish-llm-quality-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always() && needs.llm-quality.result != 'skipped'
    needs: llm-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        if: needs['llm-quality'].outputs.completion_ready == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: llm-quality-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        id: publish_pages
        if: needs['llm-quality'].outputs.completion_ready == 'true' && steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "llm judge site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Pages publication
        if: always() && needs['llm-quality'].outputs.completion_ready == 'true' && (steps.download_pages.outcome != 'success' || steps.publish_pages.outcome != 'success')
        run: |
          echo "::error::LLM Judge Pages publication failed."
          exit 1

      - name: Save daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs['llm-quality'].outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/llm-quality.done

      - name: Cache daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs['llm-quality'].outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/llm-quality.done
          key: cloud-llm-quality-v1-${{ needs['llm-quality'].outputs.eval_date }}
