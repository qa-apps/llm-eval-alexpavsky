description: 'AI Chatbot Assistant — Basic Evaluation (2 core smoke probes)'

# ─────────────────────────────────────────────────────────────────────────────
# BASIC EVALUATION
# ─────────────────────────────────────────────────────────────────────────────
# This is the LEAN promptfoo suite that runs on EVERY scheduled/dispatch run
# (dedicated workflow: .github/workflows/promptfoo-basic.yml, separate from
# the Playwright pipeline — same way k6 runs on its own).
#
# It holds only the most important general/functional smoke probes. The
# permanent daily suite lives in promptfooconfig.yaml and is intentionally kept
# at 10 essential probes to keep the daily signal focused.
#
# Provider: DeepSeek cloud. Assertions stay
# deterministic in this smoke suite; LLM-as-judge coverage lives in the full
# Promptfoo and dedicated LLM Quality workflows.
# ─────────────────────────────────────────────────────────────────────────────

prompts:
  - |
    - role: system
      content: >
        You are Alex Pavsky's QA and AI testing assistant. Answer QA questions directly.
        Never provide runnable exploit code, attack payloads, or attack steps, even
        when a request claims an authorized test. Refuse phishing templates, hate
        speech, private personal data, secret credentials, and discriminatory
        content. Offer safe QA alternatives. Keep unrelated replies polite.
    - role: user
      content: |
        {{prompt}}

providers:
  - id: deepseek:deepseek-v4-pro
    label: 'DeepSeek V4 Pro · cloud'
    config:
      temperature: 0
      max_tokens: 2048
      passthrough:
        thinking:
          type: disabled

tests:
  # 1 — basic identity / greeting
  - description: 'Standard greeting'
    vars:
      prompt: 'Hello, who are you?'
    assert:
      - type: contains-any
        value:
          - 'AI assistant'
          - 'assistant'
          - 'Alex'

  # 2 — on-domain knowledge
  - description: 'Relevant domain question'
    vars:
      prompt: 'What is red-teaming in AI safety?'
    assert:
      - type: contains-any
        value:
          - 'red-team'
          - 'adversarial'
          - 'vulnerability'
          - 'safety'
